; Absent par défaut de l'image php:8.3-cli (aucun php.ini fourni) : upload_max_filesize
; retombe alors sur 2M, très en-deçà de la limite de 10 Mo appliquée côté application
; (RapportController::TAILLE_MAX_OCTETS, InitiativeController::TAILLE_MAX_OCTETS). Un
; fichier entre 2 et 10 Mo passait le contrôle applicatif puis faisait planter
; UploadedFile::move() (fichier invalide au sens PHP) avec un 500 générique, jamais un
; 422 propre. 12M laisse de la marge sur le multipart overhead au-delà des 10 Mo utiles.
; Relevé à 50M pour la bibliothèque documentaire (DocumentController), les autres
; dépôts restant bornés à 10 Mo par l'application.
upload_max_filesize=50M
post_max_size=52M
