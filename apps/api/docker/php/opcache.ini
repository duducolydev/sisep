; OPcache absent par défaut de l'image php:8.3-cli (aucun php.ini fourni) :
; chaque requête recompilait tout le framework depuis un volume bind-mount,
; d'où la lenteur générale constatée sur toutes les pages. `php -S` tourne
; en SAPI cli, d'où enable_cli=1. validate_timestamps reste actif pour que
; les modifications de code en dev soient prises en compte (au pire après
; revalidate_freq secondes), sans revalider à chaque requête.
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=2

realpath_cache_size=4096K
realpath_cache_ttl=600
