; Réglages PHP de production. Deux écarts volontaires avec opcache.ini, qui
; sert au développement :
;
;  - validate_timestamps=0 : le code ne change jamais dans une image, donc
;    aucune raison de vérifier la date des fichiers à chaque requête. Un
;    déploiement reconstruit l'image, il n'y a rien à invalider à chaud.
;  - enable_cli=0 : le serveur applicatif est PHP-FPM, pas le SAPI cli. Les
;    commandes console (migrations, imports) n'ont pas besoin d'OPcache et
;    s'en passent sans y perdre.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0

realpath_cache_size=4096K
realpath_cache_ttl=600

; Les traces d'erreur n'ont rien à faire dans une réponse HTTP : elles vont
; au flux d'erreur du conteneur, que `docker compose logs` expose.
display_errors=Off
display_startup_errors=Off
log_errors=On
error_log=/proc/self/fd/2

; Limite la plus haute de l'application (bibliothèque documentaire, 50 Mo
; utiles), avec de la marge pour l'enrobage multipart. Les justificatifs
; restent bornés à 10 Mo par l'application elle-même.
upload_max_filesize=50M
post_max_size=52M

; Une requête applicative qui dépasse 60 s est un incident, pas une attente
; normale : les exports lourds se comptent en secondes (§ 5 exploitation).
max_execution_time=60
memory_limit=256M
