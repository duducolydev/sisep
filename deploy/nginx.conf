# Serveur unique pour le front et l'API.
#
# C'est le point important de cette configuration : le navigateur ne voit
# qu'une seule origine. Le cookie de session reste first-party, SameSite=Lax
# fonctionne sans aménagement, et il n'y a aucun CORS à configurer — donc
# aucune règle CORS à relâcher un jour par dépannage.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Taille accordée aux dépôts de fichiers : la bibliothèque documentaire
    # accepte 50 Mo (présentations d'atelier), les justificatifs 10 Mo ;
    # 52 Mo laissent la marge de l'enrobage multipart. Au-delà, nginx répond
    # 413 avant même PHP — l'interface le traduit en message clair.
    client_max_body_size 52M;

    # Entêtes de sécurité élémentaires. HSTS n'est pas posé ici : ce serveur
    # ne parle qu'en HTTP, au frontal TLS, et c'est le frontal qui l'annonce
    # (docker/nginx-sisephasaoc.conf, dans le dépôt du forum).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Les ressources construites par Vite portent une empreinte dans leur
    # nom : elles peuvent être mises en cache sans réserve. index.html, lui,
    # ne doit jamais l'être, sinon un déploiement reste invisible.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # L'API passe à PHP-FPM. Toutes les routes de l'application arrivent sur
    # le contrôleur frontal : il n'y a qu'un fichier PHP exécutable, et son
    # chemin est écrit en dur plutôt que déduit de l'URL — un SCRIPT_FILENAME
    # calculé depuis la requête est la porte d'entrée classique vers
    # l'exécution de fichiers arbitraires.
    location /api/ {
        fastcgi_pass api:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_param REQUEST_URI $request_uri;
        # Les exports et les téléchargements peuvent prendre quelques
        # secondes ; 120 s laissent la marge sans masquer un blocage.
        fastcgi_read_timeout 120;
    }

    # Application à page unique : toute URL inconnue rend index.html, et
    # c'est le routeur qui tranche. Sans cela, un rechargement sur
    # /composantes renverrait 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
