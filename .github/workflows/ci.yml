name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (Symfony)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: sisep_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: test
      DATABASE_URL: "mysql://root@127.0.0.1:3306/sisep?serverVersion=8.0.37&charset=utf8mb4"
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, intl, zip, bcmath, sodium
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: apps/api/vendor
          key: composer-${{ hashFiles('apps/api/composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint (PHP CS Fixer)
        run: php vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Types (PHPStan)
        run: php vendor/bin/phpstan analyse --memory-limit=512M

      - name: Run migrations on the test database
        run: php bin/console doctrine:migrations:migrate --no-interaction

      - name: Tests (PHPUnit)
        run: php bin/phpunit

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Lint
        run: pnpm lint

      - name: Types and build
        run: pnpm build

      - name: Tests (Vitest)
        run: pnpm test
